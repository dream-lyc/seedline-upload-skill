[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[project]
name = "seedline-question-import-sdk"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["seedline-question-content-contracts==1.0.0", "httpx>=0.28,<1", "Pillow>=11,<13"]
[project.scripts]
seedline-import = "question_import_sdk.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/question_import_sdk"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.uv.sources]
seedline-question-content-contracts = { path = "../question-content-contracts" }
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
